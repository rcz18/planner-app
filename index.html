<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<meta name="theme-color" content="#16161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=16.8">
</head>
<body>
<header class="menubar">
  <button type="button" class="brand" data-act="home" title="Home"><img src="icons/icon-192.png" alt=""><b>Planner</b><small class="ver">v16.8</small></button>
  <nav class="menu">
    <button type="button" data-act="open" title="Open project (Ctrl+O)">Open…</button>
    <button type="button" data-act="save" title="Save (Ctrl+S)">Save</button>
    <button type="button" data-act="saveas" title="Save As (Ctrl+Shift+S)">Save As…</button>
  </nav>
  <span id="fileName" class="fileName"></span>
  <span class="grow"></span>
  <span id="msg" class="msg" role="status"></span>
  <button type="button" id="ccBadge" class="ccBadge" hidden></button>
  <div id="jobBar" class="jobBar" hidden><div class="pbar"><i></i></div><span></span></div>
  <button type="button" id="applyAllBtn" class="btn applyAllBtn" hidden title="Send every tab's notes and edits to Claude in one go">Apply all changes</button>
  <button type="button" id="renderBtn" class="btn exportBtn" hidden title="Export: render this version and put it on its Premiere sequence">⬆ Export</button>
</header>

<section id="start" class="start">
  <div class="startBox">
    <img src="icons/icon-512.png" alt="" class="startLogo">
    <h1>Planner</h1>
    <p class="sub">Open a project to review and edit its plan.</p>
    <button type="button" class="btn primary big" data-act="open">Open project…</button>
    <p id="fsNote" class="warn" hidden>This browser can open projects but cannot save them. Use Chrome or Edge.</p>
    <h3>Recent</h3>
    <ul id="recent" class="recent"></ul>
  </div>
</section>

<main id="work" class="work" hidden>
  <nav id="seqTabs" class="seqTabs" aria-label="Sequences" hidden></nav>
  <section class="top">
    <div class="monWrap">
      <div class="monHead"><h2 id="projTitle"></h2><span id="projBadge" class="badge"></span><div class="tools" id="tools"></div></div>
      <div class="monitor"><div id="monitor"></div><div id="linkMedia" class="linkMedia" hidden></div></div>
      <div id="toolHint" class="toolHint"></div>
    </div>
    <aside class="side">
      <div id="directPane" class="directPane"></div>
      <div class="beatsH"><h3>Beats</h3><button type="button" id="directBtn" class="btn primary sm directBtn" title="Direct the whole part: screenshots, drawings, comments, camera moves">🎬 Direct</button></div>
      <div id="beats" class="beats"></div>
      <div class="send">
        <div class="noteRow"><textarea id="general" rows="2" placeholder="Anything else for this sequence?"></textarea><button type="button" class="mic" id="genMic" title="Dictate">🎤</button></div>
        <div class="sendBtns"><button type="button" id="approveBtn" class="btn approveBtn" title="Mark this tab as approved">✓ Approve</button><button type="button" id="reviseBtn" class="btn">Revise</button></div>
        <p id="sendMsg" class="sendMsg"></p>
      </div>
    </aside>
  </section>
  <div id="tlSplit" class="tlSplit" title="Drag to resize the timeline"></div>
  <section id="timeline" class="tl"></section>
</main>

<dialog id="newDlg"><h3 style="margin:0 0 10px">New sequence</h3>
  <label class="fld">Name <input name="sname" placeholder="H14"></label>
  <label class="fld">What should Claude know? <span class="noteRow"><textarea name="snote" rows="4" placeholder="e.g. Premiere sequence H14 is cut. Style idea, client notes, anything to avoid…"></textarea><button type="button" class="mic" title="Dictate">🎤</button></span></label>
  <div class="dlgBtns"><button type="button" class="btn no">Cancel</button><button type="button" class="btn primary yes">Send to Claude</button></div></dialog>
<input type="file" id="fileInput" accept=".planner,application/json" hidden>
<dialog id="dlg"><p></p><div class="dlgBtns"><button type="button" class="btn no"></button><button type="button" class="btn primary yes"></button></div></dialog>
<script type="module" src="app.js?v=16.8"></script>
</body>
</html>
